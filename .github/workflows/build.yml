name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
        with:
          # Three parallel LTO builds exhaust the runner's memory; build one at a time.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Build Raspberry Pi binary
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pi
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: rustbox
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustbox

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rustbox-* rustbox.service --repo "$GITHUB_REPOSITORY" --generate-notes
