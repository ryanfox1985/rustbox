{% extends "layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

{% if let Some(error) = error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action }}" class="fields">
  <label for="name">Name</label>
  <input id="name" name="name" value="{{ name }}" autofocus>

  <label for="pin_pi">GPIO (BCM number)</label>
  <select id="pin_pi" name="pin_pi">
    <option value="">None</option>
    {% for option in gpio_options %}
    <option value="{{ option.number }}"{% if option.selected %} selected{% endif %}>GPIO {{ option.number }}</option>
    {% endfor %}
  </select>

  <label class="check"><input type="checkbox" name="value"{% if value %} checked{% endif %}> On</label>

  <div class="buttons">
    <button class="primary">Save</button>
    <a href="/pins">Cancel</a>
  </div>
</form>
{% endblock %}
